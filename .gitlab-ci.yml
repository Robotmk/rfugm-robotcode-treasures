# Our CI pipeline — the flags live in robot.toml profiles.
image: python:3.12

before_script:
  - pip install -r requirements.txt

smoke:
  script:
    - robotcode -p local -p smoke -p ci robot

regression:
  script:
    - python -m bank.service --port 8765 &
    - sleep 2
    - robotcode -p service -p regression -p ci robot

nightly:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - python -m bank.service --port 8765 &
    - sleep 2
    - robotcode -p nightly robot
